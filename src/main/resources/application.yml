spring:
  application:
    name: docx-to-xml-service
  datasource:
    url: jdbc:sqlserver://docprod\\sqlprod:1433;databaseName=GAZ;encrypt=true;trustServerCertificate=true;packetSize=32767
    username: DVSQL
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30 # ФОРМУЛА: worker-threads (exec.light) + heavy-threads (exec.heavy) + 4 (поллер, ингест, резерв)
      leak-detection-threshold: 0 # 60000
      minimum-idle: 30
  task:
    scheduling:
      pool:
        size: 2
app:
  min-length-xml: 20            # минимальная длина xml успешного результата
  ingest-lookback-days: 4      # Выборка данных из DocsVision (кол-во дней назад)
  poll-interval-ms: 5000        # период опроса очереди - было 5000
  ingest-interval-ms: 30000     # период поиска новых файлов в таблицах DocsVision
  batch-size: 16                # сколько задач захватывать за раз default - 5
  heavy-threshold-mb: 10        # граница "лёгкий/тяжёлый" в МБ
  stale-timeout-sec: 900        # "зависшая" PROCESSING-задача считается потерянной
  max-retries: 2                # максимум повторов ERROR-задачи
  retry-delay-sec: 60           # пауза перед повтором ошибочной задачи
  prompt : | 
    Ты получаешь текст документа. Выполни шаги : 1. Выбери из текста названия всех юр. лиц (организация-автор и контрагенты), их ИНН и КПП, если присутствуют. 2. Определи Вид документа (классификация, принятая в системах ЭДО). 3. Заполни XML-структуру по шаблону ниже данными из текста; заполни все теги, если данных нет — оставь тег пустым. 4. Выведи мне ТОЛЬКО XML без стороннего текста и без markdown. Шаблон:<Document><Header><DocumentType></DocumentType><RelatedDocument></RelatedDocument><Date></Date><Number></Number><OrderDate></OrderDate><OrderNumber></OrderNumber><CopyNumber></CopyNumber><Summa></Summa><NDS></NDS><Currency></Currency></Header><Parties><Company><Country></Country><Name></Name><Role></Role><Address></Address><INN></INN><Phone></Phone><SignatoryCompany></SignatoryCompany></Company><Counterparties><Counterparty><Country></Country><Name></Name><Address></Address><INN></INN><Phones><Phone></Phone></Phones><SignatoryCounterparty></SignatoryCounterparty></Counterparty></Counterparties></Parties></Document> Текст документа
  exec:
    light:
      core: 25                  # лёгкий пул (обычные файлы) default - 4
      max: 25
      queue: 0
    heavy:
      core: 1                   # тяжёлый пул (огромные файлы, чтобы не съели память) default - 1
      max: 1
      queue: 500
iman:
  enabled: true
  base-url: https://ai.loodsen.ru/api/v1/chat/completions   # https://iman.ai.loodsen.ru
  model: Qwen/Qwen3-Coder-Next-FP8
#  agent: example_react
  access-token: ${IMAN_ACCESS_TOKEN:}                        # не хранить токен в git
  refresh-token: ${IMAN_REFRESH_TOKEN:}    # долговременный ключ — только в env
  refresh-url: ${IMAN_REFRESH_URL:https://iman.ai.loodsen.ru/auth/refresh}
  temperature: 0.1
  max-tokens: 10000                                         # потолок 10000
  # узнать потолок (powershell):
  #  Select-String -Path C:/svc/docx-processor/logs/application.log -Pattern 'tokens prompt/completion: (\d+)/(\d+)' |  % { [int]$_.Matches[0].Groups[2].Value } | Sort-Object
  connect-timeout: 10s
  read-timeout: 5m                                          # было "5"
  max-text-chars: 100000
  max-attempts: 2      # попыток на задачу, можно увеличит до "3"
  retry-backoff: 2s    # пауза 2с, 4с перед повторами
logging:
  file:
    name: C:/svc/docx-processor/logs/application.log
  level:
    kvo.convertXML: INFO
    org.apache.pdfbox: ERROR
    org.apache.poi.hwpf: ERROR  # отключить на Прод
ocr:
  url: http://doc-app8:4842/CDvService/86d8e4719c0cf1119f353a68ddb4ef9b/ToolsPage/ReadFile
  connect-timeout: 10s
  read-timeout: 600s      # многостраничные сканы могут распознаваться долго
  max-attempts: 2
  retry-backoff: 10s